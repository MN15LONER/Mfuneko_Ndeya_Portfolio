<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Project — Mfuneko Ndeya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">mfuneko</a>
      <ul class="nav-links">
        <li><a href="../index.html#about">about</a></li>
        <li><a href="../index.html#projects">projects</a></li>
        <li><a href="../index.html#github">github</a></li>
        <li><a href="../index.html#contact">contact</a></li>
      </ul>
    </div>
  </nav>

  <div id="project-root"></div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" style="display:none;" />
      <video id="lightbox-video" src="" controls style="display:none;"></video>
    </div>
  </div>

  <script src="../assets/js/projects-data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    function mediaPath(src) { return "../" + src; }

    function renderProject() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const project = PROJECTS.find((p) => p.slug === slug);
      const root = document.getElementById("project-root");

      if (!project) {
        root.innerHTML = `
          <div class="container not-found">
            <h2 class="section-title">Project not found</h2>
            <p class="section-desc" style="margin:0 auto 1.5rem;">That project doesn't exist yet — or the link is out of date.</p>
            <a href="../index.html#projects" class="btn btn-primary">Back to projects</a>
          </div>`;
        return;
      }

      document.getElementById("page-title").textContent = project.name + " — Mfuneko Ndeya";

      const galleryHtml = project.gallery
        .map((item, i) => {
          const src = mediaPath(item.src);
          const wideClass = i === 0 && project.gallery.length % 2 !== 0 ? " wide" : "";
          if (item.type === "video") {
            return `<div class="gallery-item gallery-item--video${wideClass}" onclick="openLightbox('${src}', 'video')" role="button" aria-label="Play video">
                      <video src="${src}" muted preload="metadata"></video>
                      <span class="play-overlay" aria-hidden="true">
                        <span class="play-btn">
                          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </span>
                        <span class="play-label">Play video</span>
                      </span>
                    </div>`;
          }
          return `<div class="gallery-item${wideClass}" onclick="openLightbox('${src}', 'image')">
                    <img src="${src}" alt="${project.name}" loading="lazy" />
                  </div>`;
        })
        .join("");

      const linksHtml = project.links
        .map(
          (l) =>
            `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">${l.label} →</a>`
        )
        .join("");

      const specsHtml = project.specs
        .map((s) => `<li><span class="k">${s.k}</span><span class="v">${s.v}</span></li>`)
        .join("");

      const tagsHtml = project.tags.map((t) => `<span class="tag">${t}</span>`).join("");

      root.innerHTML = `
        <header class="project-hero">
          <div class="container">
            <a href="../index.html#projects" class="back-link">← All projects</a>
            <div class="project-hero-meta">${tagsHtml}</div>
            <h1 class="project-detail-title">${project.name}</h1>
            <p class="project-detail-blurb">${project.blurb}</p>
            <div class="project-detail-links">${linksHtml}</div>
          </div>
        </header>

        <section class="section">
          <div class="container">
            <div class="gallery">${galleryHtml}</div>

            <div class="detail-columns">
              <div>
                <h3>Overview</h3>
                <p>${project.description}</p>
              </div>
              <div>
                <h3>Details</h3>
                <ul class="spec-list">${specsHtml}</ul>
              </div>
            </div>
          </div>
        </section>
      `;

      // wire up next/prev
      const idx = PROJECTS.findIndex((p) => p.slug === slug);
      const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
      const next = PROJECTS[(idx + 1) % PROJECTS.length];
      const nav = document.createElement("div");
      nav.className = "container";
      nav.innerHTML = `
        <div class="project-nav">
          <a href="project.html?slug=${prev.slug}">← ${prev.name}</a>
          <a href="project.html?slug=${next.slug}">${next.name} →</a>
        </div>`;
      root.appendChild(nav);

      initReveal();
    }

    document.addEventListener("DOMContentLoaded", renderProject);
  </script>
</body>
</html>
